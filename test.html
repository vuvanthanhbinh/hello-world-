<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Sản Phẩm</title>
</head>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background-color: #f4f6f9;
    padding: 40px 20px;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
}


.product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 25px;
}


.product-card {
    background-color: #fff;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    transition: transform 0.3s ease;
}

.product-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 15px rgba(0,0,0,0.1);
}

.product-image {
    width: 100%;
    height: 250px;
    object-fit: cover;
    background-color: #eee;
}

.product-info {
    padding: 15px;
}

.product-category {
    font-size: 11px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 5px;
    display: block;
}

.product-name {
    font-size: 16px;
    font-weight: 600;
    color: #333;
    margin-bottom: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.product-id {
    font-size: 12px;
    color: #aaa;
    margin-bottom: 15px;
}

.product-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid #f0f0f0;
    padding-top: 15px;
}

.product-price {
    font-size: 16px;
    font-weight: bold;
    color: #c95c3f;
}

.product-quantity {
    font-size: 13px;
    color: #666;
}
</style>

<body>

    <div class="container">
        <h2 style="text-align: center; margin-bottom: 30px; font-family: sans-serif;">Danh Sách Sản Phẩm</h2>
        
        <div class="product-grid" id="productGrid">
            </div>
    </div>

</body>

<script> 

localStorage.clear();


const mockData = [
    {
        id: "SP001",
        name: "Áo thun oversize linen",
        quantity: 85,
        price: 220000,
        category: "THỜI TRANG",
        image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=60" 
    },
    {
        id: "SP002",
        name: "Quần linen wide-leg",
        quantity: 60,
        price: 480000,
        category: "THỜI TRANG",
        image: "https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=60"
    },
    {
        id: "SP003",
        name: "Giày mule da bò",
        quantity: 30,
        price: 950000,
        category: "GIÀY DÉP",
        image: "https://images.unsplash.com/photo-1543163521-1bf539c55dd2?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=60"
    },
    {
        id: "SP004",
        name: "Túi tote washed canvas",
        quantity: 120,
        price: 185000,
        category: "TÚI XÁCH",
        image: "https://images.unsplash.com/photo-1590874103328-eac38a683ce7?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=60"
    },
    {
        id: "SP005",
        name: "Mũ bucket vải ripstop",
        quantity: 200,
        price: 120000,
        category: "PHỤ KIỆN",
        image: "https://images.unsplash.com/photo-1588850561407-ed78c282e89b?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=60"
    },
    {
        id: "SP006",
        name: "Vòng tay đan thủ công",
        quantity: 8,
        price: 95000,
        category: "PHỤ KIỆN",
        image: "https://images.unsplash.com/photo-1611591437281-460bfbe1220a?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=60"
    },
    {
        id: "SP007",
        name: "Giày sneaker suede xanh",
        quantity: 45,
        price: 1250000,
        category: "GIÀY DÉP",
        image: "https://images.unsplash.com/photo-1606107557195-0e29a4b5b4aa?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=60"
    },
    {
        id: "SP008",
        name: "Áo khoác denim vintage",
        quantity: 22,
        price: 680000,
        category: "THỜI TRANG",
        image: "https://images.unsplash.com/photo-1576995853123-5a10305d93c0?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=60"
    }
];


function initLocalStorage() {
    if (!localStorage.getItem('productData')) {
        localStorage.setItem('productData', JSON.stringify(mockData));
    }
}


function formatCurrency(amount) {
    return amount.toLocaleString('vi-VN') + ' đ';
}


function renderProducts() {
    const productGrid = document.getElementById('productGrid');
    if (!productGrid) return;
    
    productGrid.innerHTML = ''; 

    const products = JSON.parse(localStorage.getItem('productData')) || [];

    products.forEach(product => {
        const productCard = document.createElement('div');
        productCard.className = 'product-card';

        productCard.innerHTML = `
            <img src="${product.image}" alt="${product.name}" class="product-image">
            <div class="product-info">
                <span class="product-category">${product.category || 'CHƯA PHÂN LOẠI'}</span>
                <h3 class="product-name">${product.name}</h3>
                <p class="product-id">#${product.id}</p>
                
                <div class="product-footer">
                    <span class="product-price">${formatCurrency(product.price)}</span>
                    <span class="product-quantity">Còn ${product.quantity}</span>
                </div>
            </div>
        `;
        productGrid.appendChild(productCard);
    });
}


document.addEventListener('DOMContentLoaded', () => {
    initLocalStorage();
    renderProducts();
});
</script>
</html>
