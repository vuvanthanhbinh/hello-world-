<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trình chiếu ảnh bằng DOM</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap');

    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --border: rgba(255,255,255,0.07);
      --text: #f0ede8;
      --muted: rgba(240,237,232,0.4);
      --accent: #c8a96e;
      --accent2: #e8d5b0;
      --radius: 18px;
      --transition: 600ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 20% 80%, rgba(200, 169, 110, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 80% 20%, rgba(100, 80, 160, 0.06) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 780px;
    }

    .header {
      text-align: center;
      margin-bottom: 36px;
    }

    .header .label {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 500;
      margin-bottom: 10px;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(26px, 4vw, 38px);
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow:
        0 0 0 1px rgba(200,169,110,0.06),
        0 40px 80px rgba(0,0,0,0.6),
        0 8px 24px rgba(0,0,0,0.4);
      cursor: pointer;
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide.active { 
      opacity: 1; 
      z-index: 1; 
    }
    .slide.prev   { 
      opacity: 0; 
      z-index: 0; 
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    .slide-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 40px 28px 22px;
      background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, transparent 100%);
      color: #fff;
      transform: translateY(8px);
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.4s ease;
      z-index: 2;
    }

    .slide.active .slide-caption {
      opacity: 1;
      transform: translateY(0);
    }

    .slide-caption .caption-title {
      font-family: 'Playfair Display', serif;
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .slide-caption .caption-sub {
      font-size: 12px;
      opacity: 0.7;
      letter-spacing: 0.06em;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 5;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      color: #fff;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s ease;
      outline: none;
      user-select: none;
    }

    .nav-btn:hover {
      background: rgba(200,169,110,0.3);
      border-color: rgba(200,169,110,0.5);
      transform: translateY(-50%) scale(1.08);
    }

    .nav-btn:active { 
      transform: translateY(-50%) scale(0.95); 
    }

    .nav-btn.prev-btn { 
      left: 14px; 
    }
    .nav-btn.next-btn { 
      right: 14px; 
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 3px;
      background: var(--accent);
      z-index: 6;
      width: 0%;
      transition: width 0.1s linear;
      border-radius: 0 2px 2px 0;
      box-shadow: 0 0 8px rgba(200,169,110,0.6);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 24px;
      padding: 0 4px;
    }

    .dots {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(240,237,232,0.2);
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      padding: 0;
      outline: none;
    }

    .dot.active {
      background: var(--accent);
      width: 24px;
      border-radius: 4px;
      box-shadow: 0 0 8px rgba(200,169,110,0.5);
    }

    .dot:hover:not(.active) {
      background: rgba(240,237,232,0.45);
    }

    .counter {
      font-size: 12px;
      letter-spacing: 0.1em;
      color: var(--muted);
    }

    .counter span {
      color: var(--accent);
      font-weight: 500;
    }

    .autoplay-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.25s ease;
      outline: none;
    }

    .autoplay-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .autoplay-btn.playing {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(200,169,110,0.08);
    }

    .autoplay-btn .icon {
      font-size: 13px;
      line-height: 1;
    }

    .hint {
      text-align: center;
      margin-top: 16px;
      font-size: 11px;
      color: rgba(240,237,232,0.2);
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>

<div class="wrapper">
  <div class="header">
    <div class="label">Bài thực hành 04</div>
    <h1>Trình chiếu ảnh bằng DOM</h1>
  </div>

  <div class="stage" id="khungChinh">
    <div class="progress-bar" id="thanhTienTrinh"></div>

    

    <button class="nav-btn prev-btn" id="nutAnhTruoc" title="Ảnh trước">&#8592;</button>
    <button class="nav-btn next-btn" id="nutAnhSau"   title="Ảnh sau">&#8594;</button>
  </div>

  <div class="controls">
    <div class="counter"><span id="soThuTuHienTai">1</span> / <span id="tongSoAnh">5</span></div>

    <div class="dots" id="khungChamTron"></div>

    <button class="autoplay-btn playing" id="nutTuDong">
      <span class="icon" id="bietuongTuDong">⏸</span>
      <span id="nhanTuDong">Tự động</span>
    </button>
  </div>

  <div class="hint">← → để điều hướng · Space để tạm dừng</div>
</div>

<script>
  
  const danhSachAnh = [
    {
      src: 'https://tse1.mm.bing.net/th/id/OIP.KsOjqCQHdc8Ghhh0_k0SBwHaEh?pid=Api&P=0&h=180',
      tieuDe: 'Đỉnh Núi Hùng Vĩ',
      moTa: 'Dãy Alps, Thụy Sĩ'
    },
    {
      src: 'https://tse4.mm.bing.net/th/id/OIP.H4j2rhINDjfxhYRfnUISmQHaE8?pid=Api&P=0&h=180',
      tieuDe: 'Thung Lũng Xanh',
      moTa: 'Vùng cao nguyên'
    },
    {
      src: 'https://tse4.mm.bing.net/th/id/OIP.CzKXnpkc93JITkaGtmURiQHaEK?pid=Api&P=0&h=180',
      tieuDe: 'Bình Minh Trên Biển',
      moTa: 'Bãi biển nhiệt đới'
    },
    {
      src: 'https://tse2.mm.bing.net/th/id/OIP.EDURwV-BncvyErdc3JXTxAHaEK?pid=Api&P=0&h=180',
      tieuDe: 'Rừng Mưa Nhiệt Đới',
      moTa: 'Amazon, Brazil'
    },
    {
      src: 'https://tse3.mm.bing.net/th/id/OIP.K9fQ6avjmk7J7zcv6Ta3XAHaE8?pid=Api&P=0&h=180',
      tieuDe: 'Bầu Trời Đêm',
      moTa: 'Bầu Trời Đêm'
    },
  ];

  const THOI_GIAN_TU_DONG = 4000; 

  
  let viTriHienTai  = 0;
  let dangPhatTuDong = true;
  let boHenGio      = null;
  let viTriChamX    = 0;

  
  const khungChinh      = document.getElementById('khungChinh');
  const nutAnhTruoc     = document.getElementById('nutAnhTruoc');
  const nutAnhSau       = document.getElementById('nutAnhSau');
  const khungChamTron   = document.getElementById('khungChamTron');
  const soThuTuHienTai  = document.getElementById('soThuTuHienTai');
  const tongSoAnh       = document.getElementById('tongSoAnh');
  const nutTuDong       = document.getElementById('nutTuDong');
  const bietuongTuDong  = document.getElementById('bietuongTuDong');
  const nhanTuDong      = document.getElementById('nhanTuDong');
  const thanhTienTrinh  = document.getElementById('thanhTienTrinh');

  
  tongSoAnh.textContent = danhSachAnh.length;

  danhSachAnh.forEach((anhItem, chiSo) => {
    const phanTuSlide = document.createElement('div');
    phanTuSlide.className = 'slide' + (chiSo === 0 ? ' active' : '');
    phanTuSlide.dataset.index = chiSo;

    const phanTuAnh = document.createElement('img');
    phanTuAnh.src     = anhItem.src;
    phanTuAnh.alt     = anhItem.tieuDe;
    phanTuAnh.loading = chiSo === 0 ? 'eager' : 'lazy';

    const phanTuChuThich = document.createElement('div');
    phanTuChuThich.className = 'slide-caption';
    phanTuChuThich.innerHTML =
      `<div class="caption-title">${anhItem.tieuDe}</div>` +
      `<div class="caption-sub">${anhItem.moTa}</div>`;

    phanTuSlide.appendChild(phanTuAnh);
    phanTuSlide.appendChild(phanTuChuThich);
    khungChinh.appendChild(phanTuSlide);

    
    const phanTuCham = document.createElement('button');
    phanTuCham.className = 'dot' + (chiSo === 0 ? ' active' : '');
    phanTuCham.title = anhItem.tieuDe;
    phanTuCham.addEventListener('click', () => chuyenDenAnh(chiSo));
    khungChamTron.appendChild(phanTuCham);
  });

  
  function layDanhSachSlide() { return khungChinh.querySelectorAll('.slide'); }
  function layDanhSachCham()  { return khungChamTron.querySelectorAll('.dot'); }

  
  function chuyenDenAnh(viTriMoi) {
    const danhSachSlide = layDanhSachSlide();
    const danhSachCham  = layDanhSachCham();

    danhSachSlide[viTriHienTai].classList.remove('active');
    danhSachSlide[viTriHienTai].classList.add('prev');
    danhSachCham[viTriHienTai].classList.remove('active');

    setTimeout(() => danhSachSlide[viTriMoi].classList.remove('prev'), 700);

    viTriHienTai = (viTriMoi + danhSachAnh.length) % danhSachAnh.length;

    danhSachSlide[viTriHienTai].classList.add('active');
    danhSachCham[viTriHienTai].classList.add('active');
    soThuTuHienTai.textContent = viTriHienTai + 1;

    if (dangPhatTuDong) datLaiBoHenGio();
  }

  function chuyenAnhSau()   { chuyenDenAnh(viTriHienTai + 1); }
  function chuyenAnhTruoc() { chuyenDenAnh(viTriHienTai - 1); }

  
  function batDauTienTrinh() {
    thanhTienTrinh.style.transition = 'none';
    thanhTienTrinh.style.width = '0%';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        thanhTienTrinh.style.transition = `width ${THOI_GIAN_TU_DONG}ms linear`;
        thanhTienTrinh.style.width = '100%';
      });
    });
  }

  function dungTienTrinh() {
    const chieuRongHienTai = getComputedStyle(thanhTienTrinh).width;
    const chieuRongKhung   = khungChinh.offsetWidth;
    const phanTram         = (parseFloat(chieuRongHienTai) / chieuRongKhung) * 100;
    thanhTienTrinh.style.transition = 'none';
    thanhTienTrinh.style.width      = phanTram + '%';
  }

  
  function batDauBoHenGio() {
    clearInterval(boHenGio);
    boHenGio = setInterval(chuyenAnhSau, THOI_GIAN_TU_DONG);
    batDauTienTrinh();
  }

  function dungBoHenGio() {
    clearInterval(boHenGio);
    dungTienTrinh();
  }

  function datLaiBoHenGio() {
    if (!dangPhatTuDong) return;
    dungBoHenGio();
    batDauBoHenGio();
  }

  function batTatTuDong() {
    dangPhatTuDong = !dangPhatTuDong;
    nutTuDong.classList.toggle('playing', dangPhatTuDong);
    bietuongTuDong.textContent = dangPhatTuDong ? '⏸' : '▶';
    nhanTuDong.textContent     = dangPhatTuDong ? 'Tự động' : 'Thủ công';
    dangPhatTuDong ? batDauBoHenGio() : dungBoHenGio();
  }

  
  nutAnhSau.addEventListener('click', chuyenAnhSau);
  nutAnhTruoc.addEventListener('click', chuyenAnhTruoc);
  nutTuDong.addEventListener('click', batTatTuDong);

 
  document.addEventListener('keydown', suKienBanPhim => {
    if (suKienBanPhim.key === 'ArrowRight')      chuyenAnhSau();
    else if (suKienBanPhim.key === 'ArrowLeft')  chuyenAnhTruoc();
    else if (suKienBanPhim.key === ' ') {
      suKienBanPhim.preventDefault();
      batTatTuDong();
    }
  });

  
  khungChinh.addEventListener('touchstart', suKienCamUng => {
    viTriChamX = suKienCamUng.touches[0].clientX;
  }, { passive: true });

  khungChinh.addEventListener('touchend', suKienCamUng => {
    const khoangCachVuot = suKienCamUng.changedTouches[0].clientX - viTriChamX;
    if (Math.abs(khoangCachVuot) > 50) {
      khoangCachVuot < 0 ? chuyenAnhSau() : chuyenAnhTruoc();
    }
  });

  
  khungChinh.addEventListener('mouseenter', () => { if (dangPhatTuDong) dungBoHenGio(); });
  khungChinh.addEventListener('mouseleave', () => { if (dangPhatTuDong) batDauBoHenGio(); });

  
  batDauBoHenGio();
</script>
</body>
</html>
